apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate   # SQLite on RWO volume: never run two pods
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: vaultwarden
          image: vaultwarden/server
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DOMAIN
              value: https://secrets.intern.pixelandprocess.de
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: warn
            - name: ROCKET_PORT
              value: "80"
          envFrom:
            - secretRef:
                name: vaultwarden-env   # ADMIN_TOKEN (create out of band / sealed)
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /alive, port: http }
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: { path: /alive, port: http }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
