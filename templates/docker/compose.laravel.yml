# Copy into a project as docker-compose.yml (or `include:` it). Local services for Laravel dev.
# `docker compose up -d` then point .env at 127.0.0.1 with the ports below.
name: ${COMPOSE_PROJECT_NAME:-laravel-dev}
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: laravel, POSTGRES_PASSWORD: laravel, POSTGRES_DB: laravel }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: laravel, MYSQL_USER: laravel, MYSQL_PASSWORD: laravel }
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql:/var/lib/mysql]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  minio:
    image: minio/minio:latest
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: laravel, MINIO_ROOT_PASSWORD: laravellaravel }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]
volumes: { pg: {}, mysql: {}, minio: {} }
