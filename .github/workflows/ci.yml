name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: syntax
        run: |
          set -e
          for f in bootstrap.sh scripts/*.sh scripts/mac/*.sh tests/*.sh home/dot_config/omarchy/hooks/post-update.d/*.sh home/dot_bashrc.d/*.sh; do
            bash -n "$f"
          done
      - name: no unattended command can sit on a prompt
        run: |
          set -e
          # A laptop parked at step 7/9 on chezmoi's
          # "diff/overwrite/all-overwrite/skip/quit" is invisible until someone
          # walks past it. These paths all run with nobody watching. Quoted
          # strings are stripped first so a message mentioning the command, and
          # comments, are not mistaken for a call.
          bad=$(grep -rn 'chezmoi apply' bootstrap.sh scripts/ home/dot_config/omarchy/hooks/ \
            | sed 's/"[^"]*"//g' | grep -v ':[0-9]*:[[:space:]]*#' \
            | grep 'chezmoi apply' | grep -v -- '--force' || true)
          if [ -n "$bad" ]; then echo "chezmoi apply without --force:"; echo "$bad"; exit 1; fi
          echo "every unattended chezmoi apply passes --force"
      - name: every script this repo executes is executable
        run: |
          set -e
          # scripts/agents-setup.sh shipped as 100644 and bootstrap died at
          # step 8/9 with "Permission denied" on a laptop. scripts/verify.sh
          # was the same, hidden by its `|| true`, so it had never once run.
          bad=$(git ls-files -s bootstrap.sh 'scripts/*.sh' 'scripts/mac/*.sh' 'tests/*.sh' \
            | awk '$1 != "100755" { print $1, $4 }')
          if [ -n "$bad" ]; then echo "not executable in the index:"; echo "$bad"; exit 1; fi
          echo "$(git ls-files bootstrap.sh 'scripts/*.sh' 'scripts/mac/*.sh' 'tests/*.sh' | wc -l) scripts, all 100755"
      - name: lua (hypr bindings run against a strict Omarchy 4.x API stub)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p home/dot_config/hypr/bindings.lua
          lua5.4 tests/bindings-test.lua
      - name: unit + integration tests
        run: |
          git config --global user.email ci@example
          git config --global user.name CI
          ./tests/repo-sync-test.sh
          ./tests/bashrc-test.sh
          ./tests/skills-test.sh
          ./tests/bootstrap-mode-test.sh
          ./tests/self-update-test.sh
      - name: plugin manifest is well formed
        run: |
          set -e
          bad=$(sed -E 's/#.*//' packages/plugins.txt | awk 'NF' \
            | grep -vE '^https://[A-Za-z0-9._/-]+\.git$' || true)
          if [ -n "$bad" ]; then echo "malformed plugin URLs:"; echo "$bad"; exit 1; fi
          echo "$(sed -E 's/#.*//' packages/plugins.txt | awk 'NF' | wc -l) plugin URLs OK"
      - name: skills manifest is well formed
        run: |
          set -e
          # plugin <name>@<marketplace> [source], or skills <git URL>.
          bad=$(sed -E 's/#.*//' packages/skills.txt | awk 'NF' \
            | grep -vE '^(plugin[[:space:]]+[A-Za-z0-9._-]+@[A-Za-z0-9._-]+([[:space:]]+[A-Za-z0-9._:/-]+)?|skills[[:space:]]+https://[A-Za-z0-9._/-]+\.git)[[:space:]]*$' || true)
          if [ -n "$bad" ]; then echo "malformed skill entries:"; echo "$bad"; exit 1; fi
          echo "$(sed -E 's/#.*//' packages/skills.txt | awk 'NF' | wc -l) skill entries OK"
      - name: repo manifest is well formed
        run: |
          set -e
          # Every active line must be owner/repo, with an optional known flag.
          bad=$(grep -vE '^\s*(#|$)' packages/repos.txt \
            | grep -vE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+([[:space:]]+pull-only)?[[:space:]]*$' || true)
          if [ -n "$bad" ]; then echo "malformed entries:"; echo "$bad"; exit 1; fi
          echo "$(grep -cvE '^\s*(#|$)' packages/repos.txt) entries OK"
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: .
          ignore_paths: home/dot_bashrc.d/20-projects.sh.tmpl

  chezmoi:
    name: chezmoi templates render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: re-init never overwrites a configured machine's answers
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          ./tests/chezmoi-init-test.sh
      - name: render every template with fake data (no vault access in CI)
        run: |
          set -e
          # runners set XDG_CONFIG_HOME, so point chezmoi at the fake config explicitly
          export HOME=/tmp/fakehome; mkdir -p "$HOME/.config/chezmoi"
          CM_CONFIG="$HOME/.config/chezmoi/chezmoi.toml"
          cat > "$CM_CONFIG" <<'EOF'
          [data]
            hostname = "ci-box"
            gdk_scale = 1
            wifi_driver = "none"
            install_cursor = false
            sudoless_docker = false
            role = "daily"
            headscale_url = "https://headscale.example"
            vault_url = "https://secrets.example"
            vault_email = "ci@example"
            git_name = "CI"
            git_email = "ci@example"
            github_user = "ci"
            freellm_url = "https://llm.example"
            affine_url = "https://notes.example"
            ha_url = "http://ha.example"
          EOF
          # templates that call rbw are skipped here; everything else must render
          for t in $(find home -name '*.tmpl' ! -path '*private_dot_ssh/*id_ed25519*' ! -name '.chezmoi.toml.tmpl'); do
            echo "== $t"
            chezmoi --config "$CM_CONFIG" --source "$PWD/home" execute-template < "$t" > /dev/null
          done
          chezmoi --config "$CM_CONFIG" --source "$PWD/home" managed >/dev/null

